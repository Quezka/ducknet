[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ducknet"
dynamic = ["version"]
description = "DuckNet: an alternative to HTTP (DUCK/1), with its own DNS, tunnels and browser (Stagno)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
browser = ["PySide6>=6.6"]

[project.scripts]
ducknet = "ducknet.cli:main"

[project.gui-scripts]
stagno = "stagno.app:main"

[tool.setuptools.dynamic]
version = {attr = "ducknet.__version__"}

[tool.setuptools.packages.find]
include = ["ducknet*", "stagno*"]

[tool.setuptools.package-data]
stagno = ["assets/*"]
